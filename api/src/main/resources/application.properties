spring.application.name=alquilaya

# Variables de entorno: se leen del sistema o del archivo api/.env (ver api/.env.example)
# (la segunda ruta es para cuando se ejecuta desde la carpeta raíz del repositorio)
spring.config.import=optional:file:.env[.properties],optional:file:api/.env[.properties]

server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:alquilaya}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
